<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI_Talk — очередь запросов</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="server-status" class="server-status"></div>
  <header class="topbar">
    <h1 class="title">AI_Talk</h1>
    <div class="topbar-right">
      <span id="counter" class="counter">0</span>
      <button id="pip-btn" type="button" class="btn btn-pip" title="Открыть поверх всех окон (PiP)" aria-label="PiP">📌</button>
    </div>
  </header>

  <main class="main">
    <ul id="requests" class="requests"></ul>
    <div id="empty" class="empty">Очередь пуста</div>
  </main>

  <div class="hint">
    <kbd>←</kbd> / <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> — копировать текущий и перейти дальше ·
    <kbd>→</kbd> / <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>V</kbd> — вставить ответ в текущий ·
    <kbd>↑</kbd>/<kbd>↓</kbd> — сменить текущий ·
    <kbd>📌</kbd> — поверх всех окон
  </div>

  <dialog id="modal" class="modal">
    <div class="modal-header">
      <span class="modal-title">Полный запрос</span>
      <button id="modal-close" type="button" class="btn btn-close" aria-label="Закрыть">✕</button>
    </div>
    <pre id="modal-text" class="modal-text"></pre>
    <div class="modal-actions">
      <button id="modal-copy" type="button" class="action-btn">Копировать всё</button>
      <button id="modal-download" type="button" class="action-btn">Скачать .txt</button>
    </div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
