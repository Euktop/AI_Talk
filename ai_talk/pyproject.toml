[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_talk"
version = "2.1.0"
authors = [{ name = "Euktop", email = "your@email.com" }]
description = "Локальная библиотека-обёртка для взаимодействия с Ollama LLM"
requires-python = ">=3.8"
dependencies = [
    "ollama>=0.1.0",
]

[project.optional-dependencies]
web = ["actantai"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_talk*"]
