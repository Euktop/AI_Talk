[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actantai"
version = "0.1.0"
description = "Библиотека для работы с веб-версиями ИИ через браузер"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "actantweb",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
packages = ["actantai"]